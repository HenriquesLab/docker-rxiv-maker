name: On-Demand Docker Build

on:
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom tag for the build (optional)'
        required: false
        type: string
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'
      push_to_registry:
        description: 'Push to Docker Hub'
        required: true
        default: true
        type: boolean
      force_refresh:
        description: 'Force dependency refresh (ignore cache)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: henriqueslab/rxiv-maker-base

jobs:
  # Validate inputs
  validate-inputs:
    name: Validate Inputs
    runs-on: ubuntu-latest
    outputs:
      platforms_matrix: ${{ steps.parse.outputs.platforms_matrix }}
      custom_tag: ${{ steps.parse.outputs.custom_tag }}
      should_push: ${{ steps.parse.outputs.should_push }}
      cache_mode: ${{ steps.parse.outputs.cache_mode }}

    steps:
      - name: Parse and validate inputs
        id: parse
        run: |
          # Parse platforms into matrix format
          PLATFORMS="${{ github.event.inputs.platforms }}"
          echo "Input platforms: ${PLATFORMS}"
          
          # Convert to JSON array for matrix
          if [ "${PLATFORMS}" = "linux/amd64,linux/arm64" ]; then
            MATRIX='["linux/amd64", "linux/arm64"]'
          elif [ "${PLATFORMS}" = "linux/amd64" ]; then
            MATRIX='["linux/amd64"]'
          elif [ "${PLATFORMS}" = "linux/arm64" ]; then
            MATRIX='["linux/arm64"]'
          else
            echo "❌ Invalid platforms input"
            exit 1
          fi
          
          echo "platforms_matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "Platforms matrix: ${MATRIX}"
          
          # Handle custom tag
          CUSTOM_TAG="${{ github.event.inputs.custom_tag }}"
          if [ -n "${CUSTOM_TAG}" ]; then
            # Validate tag format (basic)
            if [[ "${CUSTOM_TAG}" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "custom_tag=${CUSTOM_TAG}" >> $GITHUB_OUTPUT
              echo "✅ Custom tag: ${CUSTOM_TAG}"
            else
              echo "❌ Invalid tag format: ${CUSTOM_TAG}"
              exit 1
            fi
          else
            # Generate default tag based on timestamp
            DEFAULT_TAG="on-demand-$(date +%Y%m%d-%H%M)"
            echo "custom_tag=${DEFAULT_TAG}" >> $GITHUB_OUTPUT
            echo "📅 Generated tag: ${DEFAULT_TAG}"
          fi
          
          # Push decision
          SHOULD_PUSH="${{ github.event.inputs.push_to_registry }}"
          echo "should_push=${SHOULD_PUSH}" >> $GITHUB_OUTPUT
          echo "Push to registry: ${SHOULD_PUSH}"
          
          # Cache strategy
          FORCE_REFRESH="${{ github.event.inputs.force_refresh }}"
          if [ "${FORCE_REFRESH}" = "true" ]; then
            echo "cache_mode=refresh" >> $GITHUB_OUTPUT
            echo "🔄 Cache mode: Force refresh"
          else
            echo "cache_mode=normal" >> $GITHUB_OUTPUT
            echo "📦 Cache mode: Normal"
          fi

  # Build on-demand images
  on-demand-build:
    name: On-Demand Build
    runs-on: ubuntu-latest
    needs: validate-inputs
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate-inputs.outputs.platforms_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate-inputs.outputs.custom_tag }}
            type=raw,value=on-demand-latest
            type=sha,prefix=on-demand-sha-

      - name: Prepare platform name
        id: platform
        run: |
          SAFE_PLATFORM=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "safe_name=${SAFE_PLATFORM}" >> $GITHUB_OUTPUT

      - name: Build platform-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false
          cache-from: ${{ needs.validate-inputs.outputs.cache_mode != 'refresh' && format('type=gha,scope=on-demand-{0}', matrix.platform) || '' }}
          cache-to: type=gha,scope=on-demand-${{ matrix.platform }},mode=max
          outputs: type=docker,dest=/tmp/image-${{ steps.platform.outputs.safe_name }}.tar
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            ${{ needs.validate-inputs.outputs.cache_mode == 'refresh' && 'REFRESH_PACKAGES=1' || '' }}
        continue-on-error: false
        timeout-minutes: 50

      - name: Verify build output
        run: |
          IMAGE_FILE="/tmp/image-${{ steps.platform.outputs.safe_name }}.tar"
          if [ -f "$IMAGE_FILE" ]; then
            SIZE_MB=$(du -m "$IMAGE_FILE" | cut -f1)
            echo "✅ Build artifact: $IMAGE_FILE (${SIZE_MB}MB)"
            
            # Integrity check
            if tar -tf "$IMAGE_FILE" >/dev/null 2>&1; then
              echo "✅ Image integrity verified"
            else
              echo "❌ Image integrity failed"
              exit 1
            fi
          else
            echo "❌ Build artifact missing"
            exit 1
          fi

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: on-demand-image-${{ steps.platform.outputs.safe_name }}
          path: /tmp/image-${{ steps.platform.outputs.safe_name }}.tar
          retention-days: 7  # Keep longer for on-demand builds

  # Test on-demand builds
  test-on-demand-images:
    name: Test On-Demand Images
    runs-on: ubuntu-latest
    needs: [validate-inputs, on-demand-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Load and test images
        run: |
          echo "📥 Loading on-demand build images..."
          
          # Load all platform images
          find artifacts -name "*.tar" -type f | while read image_file; do
            echo "Loading: $image_file"
            docker load --input "$image_file"
          done
          
          echo "🧪 Testing on-demand image functionality..."
          
          # Use custom tag for testing
          CUSTOM_TAG="${{ needs.validate-inputs.outputs.custom_tag }}"
          
          # Comprehensive test suite
          docker run --rm --timeout=120s ${{ env.IMAGE_NAME }}:${CUSTOM_TAG} bash -c "
          set -e
          echo '🐍 Testing Python environment...'
          python3 -c '
          import sys, os, subprocess
          print(f\"Python {sys.version}\")
          
          # Test scientific stack
          import numpy, pandas, matplotlib, scipy, yaml, requests
          print(\"✅ Scientific libraries OK\")
          
          # Test image processing
          from PIL import Image
          print(\"✅ PIL/Pillow OK\")
          
          # Test plotting
          import matplotlib.pyplot as plt
          import seaborn as sns
          print(\"✅ Plotting libraries OK\")
          '
          
          echo '🔧 Testing LaTeX environment...'
          pdflatex --version | head -1
          bibtex --version | head -1
          
          echo '📊 Testing R environment...'
          R --version | head -1
          R -e 'packageVersion(\"ggplot2\")'
          
          echo '🎨 Testing fonts...'
          fc-list | head -5
          
          echo '✅ All tests passed!'
          "

  # Push to registry (conditional)
  push-on-demand-to-registry:
    name: Push On-Demand to Registry
    runs-on: ubuntu-latest
    needs: [validate-inputs, on-demand-build, test-on-demand-images]
    if: needs.validate-inputs.outputs.should_push == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate-inputs.outputs.custom_tag }}
            type=raw,value=on-demand-latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PUSH }}

      - name: Build and push on-demand multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          platforms: ${{ github.event.inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: |
            type=gha,scope=on-demand-linux-amd64
            type=gha,scope=on-demand-linux-arm64
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            ${{ needs.validate-inputs.outputs.cache_mode == 'refresh' && 'REFRESH_PACKAGES=1' || '' }}
        timeout-minutes: 50

      - name: Verify pushed images
        run: |
          echo "🔍 Verifying pushed images..."
          
          CUSTOM_TAG="${{ needs.validate-inputs.outputs.custom_tag }}"
          
          # Wait for propagation
          sleep 30
          
          # Test main custom tag
          if docker pull ${{ env.IMAGE_NAME }}:${CUSTOM_TAG}; then
            echo "✅ Custom tag image pulled successfully"
            
            # Quick verification
            if docker run --rm --timeout=60s ${{ env.IMAGE_NAME }}:${CUSTOM_TAG} python3 -c "
            import sys
            print(f'✅ Image verification successful: Python {sys.version}')
            "; then
              echo "✅ On-demand image verification passed"
            else
              echo "❌ Image functionality test failed"
              exit 1
            fi
          else
            echo "❌ Failed to pull custom tag image"
            exit 1
          fi

  # On-demand build summary
  on-demand-summary:
    name: On-Demand Build Summary
    runs-on: ubuntu-latest
    needs: [validate-inputs, on-demand-build, test-on-demand-images, push-on-demand-to-registry]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 On-Demand Docker Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Custom Tag:** \`${{ needs.validate-inputs.outputs.custom_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** ${{ github.event.inputs.platforms }}" >> $GITHUB_STEP_SUMMARY
          echo "**Push to Registry:** ${{ needs.validate-inputs.outputs.should_push }}" >> $GITHUB_STEP_SUMMARY
          echo "**Cache Mode:** ${{ needs.validate-inputs.outputs.cache_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate-inputs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.on-demand-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test-on-demand-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Push | ${{ needs.push-on-demand-to-registry.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.validate-inputs.outputs.should_push }}" == "true" ] && [ "${{ needs.push-on-demand-to-registry.result }}" == "success" ]; then
            echo "**✅ On-demand build completed and pushed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Available Tags:**" >> $GITHUB_STEP_SUMMARY
            echo "- \`henriqueslab/rxiv-maker-base:${{ needs.validate-inputs.outputs.custom_tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`henriqueslab/rxiv-maker-base:on-demand-latest\`" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.validate-inputs.outputs.should_push }}" == "false" ]; then
            echo "**✅ On-demand build completed (not pushed to registry)**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Build artifacts are available as workflow artifacts for download." >> $GITHUB_STEP_SUMMARY
          else
            echo "**❌ On-demand build failed**" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi