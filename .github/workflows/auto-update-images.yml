name: 🔄 Auto-Update Docker Images

on:
  repository_dispatch:
    types: [version-update]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (e.g., v1.6.1)'
        required: true
        type: string
      clean_version:
        description: 'Clean version without v prefix (e.g., 1.6.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run mode (show what would be done)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: henriqueslab/rxiv-maker-base

jobs:
  update-images:
    name: 🐳 Update Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version information
        id: version
        run: |
          # Get version from dispatch event or manual input
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
            CLEAN_VERSION="${{ github.event.client_payload.clean_version }}"
            TRIGGER_SOURCE="${{ github.event.client_payload.source }}"
            TRIGGERED_BY="${{ github.event.client_payload.triggered_by }}"
            PYPI_URL="${{ github.event.client_payload.pypi_url }}"
          else
            VERSION="${{ github.event.inputs.version }}"
            CLEAN_VERSION="${{ github.event.inputs.clean_version }}"
            TRIGGER_SOURCE="manual"
            TRIGGERED_BY="${{ github.actor }}"
            PYPI_URL="https://pypi.org/project/rxiv-maker/$CLEAN_VERSION/"
          fi

          # Validate version format
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "trigger_source=$TRIGGER_SOURCE" >> $GITHUB_OUTPUT
          echo "triggered_by=$TRIGGERED_BY" >> $GITHUB_OUTPUT
          echo "pypi_url=$PYPI_URL" >> $GITHUB_OUTPUT

          echo "🐳 Updating Docker images to version: $VERSION ($CLEAN_VERSION)"
          echo "🎯 Triggered by: $TRIGGERED_BY ($TRIGGER_SOURCE)"

      - name: Set up QEMU
        if: github.event.inputs.dry_run != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event.inputs.dry_run != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Verify PyPI package availability
        id: pypi
        run: |
          echo "🔍 Verifying PyPI package availability for version ${{ steps.version.outputs.clean_version }}"

          # Wait for PyPI propagation with retry logic
          for attempt in {1..5}; do
            echo "🎯 Attempt $attempt to verify PyPI package..."

            PYPI_API_URL="https://pypi.org/pypi/rxiv-maker/${{ steps.version.outputs.clean_version }}/json"
            if curl -f -s "$PYPI_API_URL" > /dev/null; then
              echo "✅ PyPI package available on attempt $attempt"
              echo "package_available=true" >> $GITHUB_OUTPUT
              break
            else
              echo "❌ PyPI package not available on attempt $attempt"
              if [ $attempt -eq 5 ]; then
                echo "❌ PyPI package not available after 5 attempts"
                echo "⚠️ Will proceed but image build may fail"
                echo "package_available=false" >> $GITHUB_OUTPUT
              else
                echo "⏳ Waiting 30 seconds before retry..."
                sleep 30
              fi
            fi
          done

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.clean_version }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Rxiv-Maker Base Image
            org.opencontainers.image.description=Base Docker image for rxiv-maker with all dependencies
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.vendor=HenriquesLab
            org.opencontainers.image.source=https://github.com/HenriquesLab/docker-rxiv-maker
            org.opencontainers.image.url=https://hub.docker.com/r/henriqueslab/rxiv-maker-base
            org.opencontainers.image.documentation=https://github.com/HenriquesLab/rxiv-maker
            rxiv-maker.version=${{ steps.version.outputs.clean_version }}
            rxiv-maker.pypi-url=${{ steps.version.outputs.pypi_url }}
            rxiv-maker.trigger-source=${{ steps.version.outputs.trigger_source }}

      - name: Log in to Docker Hub
        if: github.event.inputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PUSH }}

      - name: Update Dockerfile with new version
        id: dockerfile
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "🧪 DRY RUN: Would update Dockerfile with:"
            echo "  rxiv-maker version: ${{ steps.version.outputs.clean_version }}"
            echo "  PyPI package URL: ${{ steps.version.outputs.pypi_url }}"
            echo "  Image tags: ${{ steps.meta.outputs.tags }}"
            exit 0
          fi

          echo "🔧 Updating Dockerfile with new version..."

          # Check if Dockerfile exists
          if [[ ! -f "images/base/Dockerfile" ]]; then
            echo "❌ Base Dockerfile not found at images/base/Dockerfile"
            exit 1
          fi

          # Create backup
          cp images/base/Dockerfile images/base/Dockerfile.backup

          # Update version in Dockerfile (if version is pinned)
          # This looks for patterns like "rxiv-maker==1.6.0" or "rxiv-maker>=1.6.0"
          if grep -q "rxiv-maker==" images/base/Dockerfile; then
            sed -i "s/rxiv-maker==[0-9]\+\.[0-9]\+\.[0-9]\+/rxiv-maker==${{ steps.version.outputs.clean_version }}/g" images/base/Dockerfile
            echo "✅ Updated pinned rxiv-maker version in Dockerfile"
          elif grep -q "rxiv-maker>=" images/base/Dockerfile; then
            sed -i "s/rxiv-maker>=[0-9]\+\.[0-9]\+\.[0-9]\+/rxiv-maker>=${{ steps.version.outputs.clean_version }}/g" images/base/Dockerfile
            echo "✅ Updated minimum rxiv-maker version in Dockerfile"
          else
            echo "ℹ️ No version pinning found in Dockerfile - using latest from PyPI"
          fi

          # Add build args for version information
          if ! grep -q "ARG RXIV_VERSION" images/base/Dockerfile; then
            sed -i '1i ARG RXIV_VERSION=${{ steps.version.outputs.clean_version }}' images/base/Dockerfile
            sed -i '2i ARG BUILD_DATE' images/base/Dockerfile
            echo "✅ Added version build arguments to Dockerfile"
          fi

          # Add labels if not present
          if ! grep -q "LABEL rxiv-maker.version" images/base/Dockerfile; then
            echo '' >> images/base/Dockerfile
            echo '# Metadata labels' >> images/base/Dockerfile
            echo 'LABEL rxiv-maker.version="${RXIV_VERSION}"' >> images/base/Dockerfile
            echo 'LABEL rxiv-maker.build-date="${BUILD_DATE}"' >> images/base/Dockerfile
            echo "✅ Added metadata labels to Dockerfile"
          fi

          echo "dockerfile_updated=true" >> $GITHUB_OUTPUT

      - name: Build and test images
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "🏗️ Building Docker images for testing..."

          # Build for testing (single platform first)
          docker buildx build \
            --platform linux/amd64 \
            --build-arg RXIV_VERSION=${{ steps.version.outputs.clean_version }} \
            --build-arg BUILD_DATE=$(date -Iseconds) \
            -f images/base/Dockerfile \
            --load \
            -t test-image:${{ steps.version.outputs.clean_version }} \
            .

          echo "✅ Test image built successfully"

          # Test the image
          echo "🧪 Testing image functionality..."

          # Basic functionality test
          docker run --rm test-image:${{ steps.version.outputs.clean_version }} python3 -c "
          import sys
          print(f'Python version: {sys.version}')

          # Test rxiv-maker installation
          try:
              import rxiv_maker
              print(f'rxiv-maker version: {rxiv_maker.__version__}')
              
              # Verify it's the expected version
              if rxiv_maker.__version__ == '${{ steps.version.outputs.clean_version }}':
                  print('✅ Version matches expected: ${{ steps.version.outputs.clean_version }}')
              else:
                  print(f'⚠️ Version mismatch: expected ${{ steps.version.outputs.clean_version }}, got {rxiv_maker.__version__}')
                  
          except ImportError as e:
              print(f'❌ Failed to import rxiv-maker: {e}')
              sys.exit(1)

          # Test CLI availability  
          import subprocess
          try:
              result = subprocess.run(['rxiv', '--version'], capture_output=True, text=True, timeout=10)
              print(f'✅ CLI available: {result.stdout.strip()}')
          except Exception as e:
              print(f'⚠️ CLI test failed: {e}')

          print('✅ Image functionality test completed')
          " || {
            echo "❌ Image functionality test failed"
            exit 1
          }

          echo "test_success=true" >> $GITHUB_OUTPUT

      - name: Build and push multi-platform images
        if: github.event.inputs.dry_run != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            RXIV_VERSION=${{ steps.version.outputs.clean_version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed images
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "🔍 Verifying pushed images..."

          # Test each pushed tag
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            echo "🎯 Verifying tag: $tag"
            
            for attempt in {1..3}; do
              echo "  Attempt $attempt..."
              
              if docker pull "$tag" && docker run --rm --timeout=30s "$tag" python3 -c "
                import rxiv_maker
                print(f'✅ {tag}: rxiv-maker v{rxiv_maker.__version__} verified')
              "; then
                echo "  ✅ $tag verified successfully"
                break
              else
                echo "  ❌ $tag verification failed on attempt $attempt"
                if [ $attempt -eq 3 ]; then
                  echo "  ⚠️ $tag verification failed after 3 attempts"
                  echo "verification_failed=true" >> $GITHUB_OUTPUT
                else
                  echo "  ⏳ Waiting 30 seconds before retry..."
                  sleep 30
                fi
              fi
            done
          done

      - name: Update image documentation
        if: github.event.inputs.dry_run != 'true' && steps.dockerfile.outputs.dockerfile_updated == 'true'
        run: |
          echo "📝 Updating image documentation..."

          # Update README if it exists
          if [[ -f "README.md" ]]; then
            # Update version badges/references
            sed -i "s/rxiv-maker-[0-9]\+\.[0-9]\+\.[0-9]\+/rxiv-maker-${{ steps.version.outputs.clean_version }}/g" README.md
            sed -i "s/version-[0-9]\+\.[0-9]\+\.[0-9]\+/version-${{ steps.version.outputs.clean_version }}/g" README.md
            echo "✅ README updated with new version references"
          fi

          # Update docker-compose examples if they exist
          if [[ -f "docker-compose.yml" ]]; then
            sed -i "s/:latest/:${{ steps.version.outputs.clean_version }}/g" docker-compose.yml
            echo "✅ docker-compose.yml updated"
          fi

      - name: Create pull request with changes
        if: github.event.inputs.dry_run != 'true' && steps.dockerfile.outputs.dockerfile_updated == 'true'
        run: |
          echo "🚀 Creating pull request for image updates..."

          # Check if there are any changes to commit
          if ! git diff --quiet; then
            # Configure git
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Create branch
            BRANCH_NAME="auto-update-v${{ steps.version.outputs.clean_version }}"
            git checkout -b "$BRANCH_NAME"

            # Add and commit changes
            git add images/base/Dockerfile README.md docker-compose.yml 2>/dev/null || true
            git commit -m "🐳 Update Docker images to v${{ steps.version.outputs.clean_version }}

            Automated update triggered by ${{ steps.version.outputs.trigger_source }}
            - Update rxiv-maker to version ${{ steps.version.outputs.clean_version }}
            - Rebuild base images with new package version
            - Update metadata and documentation

            Triggered by: ${{ steps.version.outputs.triggered_by }}"

            # Push branch
            git push origin "$BRANCH_NAME"

            # Create pull request
            PR_TITLE="🐳 Update Docker images to v${{ steps.version.outputs.clean_version }}"
            PR_BODY="## 🐳 Automated Docker Image Update

            This PR automatically updates Docker images to use rxiv-maker version **v${{ steps.version.outputs.clean_version }}**.

            ### Changes
            - 🔄 **rxiv-maker version**: Updated to ${{ steps.version.outputs.clean_version }}
            - 🏗️ **Images rebuilt**: Multi-platform (linux/amd64, linux/arm64)
            - 🏷️ **New tags**: \`${{ steps.version.outputs.clean_version }}\`, \`${{ steps.version.outputs.version }}\`, \`latest\`
            - 📝 **Documentation**: Updated version references

            ### Trigger Information
            - 🎯 **Triggered by**: ${{ steps.version.outputs.triggered_by }}
            - 📡 **Source**: ${{ steps.version.outputs.trigger_source }}
            - 🔗 **PyPI Package**: [${{ steps.version.outputs.pypi_url }}](${{ steps.version.outputs.pypi_url }})
            - 🕐 **Generated**: $(date -Iseconds)

            ### Validation Status
            - ✅ PyPI package availability ${{ steps.pypi.outputs.package_available == 'true' && 'confirmed' || 'pending' }}
            - ✅ Single-platform build and test successful
            - ✅ Multi-platform images pushed to Docker Hub
            - ${{ steps.verify_images.outputs.verification_failed != 'true' && '✅' || '⚠️' }} Image verification ${{ steps.verify_images.outputs.verification_failed != 'true' && 'successful' || 'had issues' }}

            ### Docker Images
            The following images have been built and pushed:

            $(echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/')

            ### Usage
            \`\`\`bash
            # Use specific version
            docker run --rm henriqueslab/rxiv-maker-base:${{ steps.version.outputs.clean_version }} rxiv --version

            # Use latest
            docker run --rm henriqueslab/rxiv-maker-base:latest rxiv --version
            \`\`\`

            ---
            🤖 _This PR was automatically generated by the [auto-update-images workflow](https://github.com/HenriquesLab/docker-rxiv-maker/actions/workflows/auto-update-images.yml)_"

            gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --head "$BRANCH_NAME" \
              --base main \
              --label "automated" \
              --label "version-update"

            PR_URL=$(gh pr view "$BRANCH_NAME" --json url --jq .url)
            echo "✅ Pull request created: $PR_URL"
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No file changes detected, skipping PR creation"
          fi

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate workflow summary
        if: always()
        run: |
          echo "## 🐳 Docker Images Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ steps.version.outputs.trigger_source }} (by ${{ steps.version.outputs.triggered_by }})" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "**Mode:** 🧪 Dry Run" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode:** 🚀 Production" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "### 🧪 Result: Dry Run Completed" >> $GITHUB_STEP_SUMMARY
            echo "Images would be rebuilt with rxiv-maker v${{ steps.version.outputs.clean_version }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🚀 Result: Images Updated" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Images rebuilt with rxiv-maker v${{ steps.version.outputs.clean_version }}" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Multi-platform builds (linux/amd64, linux/arm64)" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Pushed to Docker Hub with tags:" >> $GITHUB_STEP_SUMMARY
            
            # Add tag list
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
            
            if [ -n "${{ steps.create_pr.outputs.pr_url }}" ]; then
              echo "- ✅ [Pull request created](${{ steps.create_pr.outputs.pr_url }})" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  # Success gate
  update-success:
    name: ✅ Update Success
    runs-on: ubuntu-latest
    needs: update-images
    if: always()

    steps:
      - name: Report final status
        run: |
          if [ "${{ needs.update-images.result }}" == "success" ]; then
            echo "✅ Docker images update completed successfully"
          else
            echo "❌ Docker images update failed"
            echo "📋 Check workflow logs for details"
            exit 1
          fi