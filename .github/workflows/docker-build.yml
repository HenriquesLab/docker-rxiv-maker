name: Docker Build & Release

on:
  push:
    branches: [main, dev]
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/docker-build.yml'

  pull_request:
    branches: [main, dev]
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/docker-build.yml'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to registry'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: henriqueslab/rxiv-maker-base

jobs:
  # Simple change detection
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.decision.outputs.should-build }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build decision
        id: decision
        run: |
          SHOULD_BUILD=false

          # Always build on manual trigger
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SHOULD_BUILD=true
            echo "🚀 Manual trigger - building"
          # Always build on pull request for testing
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            SHOULD_BUILD=true
            echo "🔄 Pull request - building for testing"
          # Always build on release
          elif [ "${{ github.event_name }}" == "release" ]; then
            SHOULD_BUILD=true
            echo "🏷️ Release - building"
          # Build on push to main/dev
          elif [ "${{ github.event_name }}" == "push" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/dev" ]; then
              SHOULD_BUILD=true
              echo "🚀 Push to main/dev - building"
            fi
          fi

          echo "should-build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "Build decision: $SHOULD_BUILD"

  # Build Docker images
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should-build == 'true'
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Prepare platform name for file paths
        id: platform
        run: |
          # Convert platform name to safe filename (replace / with -)
          SAFE_PLATFORM=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "safe_name=$SAFE_PLATFORM" >> $GITHUB_OUTPUT
          echo "Platform: ${{ matrix.platform }} -> Safe name: $SAFE_PLATFORM"

      - name: Build platform-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,scope=build-${{ matrix.platform }},mode=max
          outputs: type=docker,dest=/tmp/image-${{ steps.platform.outputs.safe_name }}.tar
        continue-on-error: false
        timeout-minutes: 45  # Explicit timeout per build

      - name: Verify build output
        run: |
          IMAGE_FILE="/tmp/image-${{ steps.platform.outputs.safe_name }}.tar"
          if [ -f "$IMAGE_FILE" ]; then
            echo "✅ Build artifact created: $IMAGE_FILE"
            echo "📦 Size: $(du -h $IMAGE_FILE | cut -f1)"

            # Basic integrity check
            if tar -tf "$IMAGE_FILE" >/dev/null 2>&1; then
              echo "✅ Image tar file integrity verified"
            else
              echo "❌ Image tar file integrity check failed"
              exit 1
            fi
          else
            echo "❌ Build artifact missing: $IMAGE_FILE"
            exit 1
          fi

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.platform.outputs.safe_name }}
          path: /tmp/image-${{ steps.platform.outputs.safe_name }}.tar
          retention-days: 1

  # Test built images
  test-images:
    name: Test Images
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images]
    if: needs.detect-changes.outputs.should-build == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AMD64 image artifact
        id: download-amd64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docker-image-linux-amd64
          path: artifacts/amd64/

      - name: Download ARM64 image artifact
        id: download-arm64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docker-image-linux-arm64
          path: artifacts/arm64/

      - name: Verify artifact availability
        id: verify-artifacts
        run: |
          echo "🔍 Verifying downloaded artifacts..."
          
          AVAILABLE_ARTIFACTS=0
          ARTIFACT_INFO=""
          
          # Check AMD64 artifact
          if [ -d "artifacts/amd64" ] && [ "$(ls -A artifacts/amd64 2>/dev/null)" ]; then
            if [ -f "artifacts/amd64/"*.tar ]; then
              AVAILABLE_ARTIFACTS=$((AVAILABLE_ARTIFACTS + 1))
              AMD64_SIZE=$(du -sh artifacts/amd64/*.tar | cut -f1)
              ARTIFACT_INFO="$ARTIFACT_INFO\n✅ AMD64 artifact: $AMD64_SIZE"
              echo "AMD64_AVAILABLE=true" >> $GITHUB_ENV
            else
              echo "⚠️ AMD64 directory exists but no tar file found"
              echo "AMD64_AVAILABLE=false" >> $GITHUB_ENV
            fi
          else
            echo "❌ AMD64 artifact not available (download status: ${{ steps.download-amd64.outcome }})"
            echo "AMD64_AVAILABLE=false" >> $GITHUB_ENV
          fi
          
          # Check ARM64 artifact
          if [ -d "artifacts/arm64" ] && [ "$(ls -A artifacts/arm64 2>/dev/null)" ]; then
            if [ -f "artifacts/arm64/"*.tar ]; then
              AVAILABLE_ARTIFACTS=$((AVAILABLE_ARTIFACTS + 1))
              ARM64_SIZE=$(du -sh artifacts/arm64/*.tar | cut -f1)
              ARTIFACT_INFO="$ARTIFACT_INFO\n✅ ARM64 artifact: $ARM64_SIZE"
              echo "ARM64_AVAILABLE=true" >> $GITHUB_ENV
            else
              echo "⚠️ ARM64 directory exists but no tar file found"
              echo "ARM64_AVAILABLE=false" >> $GITHUB_ENV
            fi
          else
            echo "❌ ARM64 artifact not available (download status: ${{ steps.download-arm64.outcome }})"
            echo "ARM64_AVAILABLE=false" >> $GITHUB_ENV
          fi
          
          # Summary
          echo "📊 Artifact Summary:"
          echo -e "$ARTIFACT_INFO"
          echo "📦 Available artifacts: $AVAILABLE_ARTIFACTS/2"
          
          if [ $AVAILABLE_ARTIFACTS -gt 0 ]; then
            echo "✅ Proceeding with $AVAILABLE_ARTIFACTS available artifacts"
            echo "ARTIFACTS_AVAILABLE=true" >> $GITHUB_ENV
            echo "AVAILABLE_COUNT=$AVAILABLE_ARTIFACTS" >> $GITHUB_ENV
          else
            echo "🚫 No artifacts available - cannot proceed with testing"
            echo "ARTIFACTS_AVAILABLE=false" >> $GITHUB_ENV
            
            # Provide helpful debugging information
            echo ""
            echo "🔍 Debug Information:"
            echo "AMD64 download outcome: ${{ steps.download-amd64.outcome }}"
            echo "ARM64 download outcome: ${{ steps.download-arm64.outcome }}"
            ls -la artifacts/ || echo "No artifacts directory"
            exit 1
          fi

      - name: Load and test images
        if: env.ARTIFACTS_AVAILABLE == 'true'
        run: |
          echo "🐳 Loading built Docker images..."
          echo "📦 Available artifacts count: $SUCCESSFUL_DOWNLOADS"
          
          LOADED_IMAGES=0
          FAILED_LOADS=0
          
          # Process available tar files from each platform
          if [ "$AMD64_AVAILABLE" = "true" ]; then
            echo "🔄 Processing AMD64 artifacts..."
            for image_file in artifacts/amd64/*.tar; do
              if [ -f "$image_file" ]; then
                echo "📥 Processing AMD64 image: $image_file"
                
                # Verify file integrity first
                if ! tar -tf "$image_file" >/dev/null 2>&1; then
                  echo "❌ Corrupted AMD64 tar file detected: $image_file"
                  FAILED_LOADS=$((FAILED_LOADS + 1))
                  continue
                fi
                
                echo "🔄 Loading AMD64 Docker image from $image_file..."
                if docker load --input "$image_file" 2>&1; then
                  echo "✅ Successfully loaded AMD64 image: $image_file"
                  LOADED_IMAGES=$((LOADED_IMAGES + 1))
                  
                  # Extract and display loaded image details
                  LOADED_REPO=$(docker load --input "$image_file" 2>&1 | grep "Loaded image:" | sed 's/Loaded image: //' | head -1 || echo "unknown")
                  echo "📋 Loaded AMD64 image: $LOADED_REPO"
                else
                  echo "❌ Failed to load AMD64 image: $image_file"
                  FAILED_LOADS=$((FAILED_LOADS + 1))
                fi
              fi
            done
          fi
          
          if [ "$ARM64_AVAILABLE" = "true" ]; then
            echo "🔄 Processing ARM64 artifacts..."
            for image_file in artifacts/arm64/*.tar; do
              if [ -f "$image_file" ]; then
                echo "📥 Processing ARM64 image: $image_file"
                
                # Verify file integrity first
                if ! tar -tf "$image_file" >/dev/null 2>&1; then
                  echo "❌ Corrupted ARM64 tar file detected: $image_file"
                  FAILED_LOADS=$((FAILED_LOADS + 1))
                  continue
                fi
                
                echo "🔄 Loading ARM64 Docker image from $image_file..."
                if docker load --input "$image_file" 2>&1; then
                  echo "✅ Successfully loaded ARM64 image: $image_file"
                  LOADED_IMAGES=$((LOADED_IMAGES + 1))
                  
                  # Extract and display loaded image details
                  LOADED_REPO=$(docker load --input "$image_file" 2>&1 | grep "Loaded image:" | sed 's/Loaded image: //' | head -1 || echo "unknown")
                  echo "📋 Loaded ARM64 image: $LOADED_REPO"
                else
                  echo "❌ Failed to load ARM64 image: $image_file"
                  FAILED_LOADS=$((FAILED_LOADS + 1))
                fi
              fi
            done
          fi
          
          # Get actual loaded image count (not from subshell)
          ACTUAL_LOADED=$(docker images ${{ env.IMAGE_NAME }} --format "table {{.Repository}}:{{.Tag}}" | grep -v "REPOSITORY:TAG" | wc -l || echo "0")
          echo "🎯 Actually loaded images: $ACTUAL_LOADED"
          
          if [ "$ACTUAL_LOADED" -eq 0 ]; then
            echo "❌ No Docker images were successfully loaded"
            exit 1
          fi
          
          echo "🧪 Testing image functionality with loaded images..."
          
          # Get the most recent image tag for testing
          TEST_TAG=$(docker images ${{ env.IMAGE_NAME }} --format "{{.Repository}}:{{.Tag}}" | head -1)
          if [ -z "$TEST_TAG" ]; then
            echo "❌ Could not determine image tag for testing"
            exit 1
          fi
          
          echo "🎯 Testing image: $TEST_TAG"
          
          # Test with enhanced retry logic
          for attempt in {1..3}; do
            echo "🔍 Test attempt $attempt..."
            
            # Enhanced test with timeout and better error handling
            if timeout 120s docker run --rm "$TEST_TAG" python3 -c "
            import sys
            print(f'🐍 Python version: {sys.version}')
            print(f'🏗️  Platform: {sys.platform}')
            
            # Test critical dependencies
            try:
                import json, os, subprocess, tempfile
                print('✅ Core Python modules available')
                
                # Test basic file operations (important for rxiv-maker)
                with tempfile.NamedTemporaryFile(mode='w', suffix='.txt', delete=True) as f:
                    f.write('test content')
                    f.flush()
                    print('✅ File operations working')
                
                # Test subprocess execution
                result = subprocess.run(['python3', '--version'], capture_output=True, text=True)
                if result.returncode == 0:
                    print(f'✅ Subprocess execution: {result.stdout.strip()}')
                else:
                    raise Exception('Subprocess test failed')
                    
            except ImportError as e:
                print(f'❌ Missing core modules: {e}')
                sys.exit(1)
            except Exception as e:
                print(f'❌ Functionality test failed: {e}')
                sys.exit(1)
            
            print('✅ Docker image comprehensive test successful!')
            "; then
              echo "✅ Image test passed on attempt $attempt"
              echo "🎉 Docker image testing completed successfully!"
              break
            else
              echo "❌ Image test failed on attempt $attempt"
              if [ $attempt -eq 3 ]; then
                echo "🚫 Image test failed after 3 attempts"
                
                # Provide debugging information
                echo "🔍 Debug information:"
                echo "Available images:"
                docker images ${{ env.IMAGE_NAME }}
                echo ""
                echo "Docker system info:"
                docker version || true
                echo ""
                echo "Available disk space:"
                df -h || true
                
                exit 1
              else
                echo "⏳ Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done

  # Push to registry (conditional)
  push-to-registry:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images, test-images]
    if: |
      needs.detect-changes.outputs.should-build == 'true' &&
      (
        github.ref == 'refs/heads/main' ||
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_registry == 'true')
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PUSH }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: |
            type=gha,scope=build-linux-amd64
            type=gha,scope=build-linux-arm64
        continue-on-error: false
        timeout-minutes: 45

      - name: Verify pushed images
        run: |
          echo "🔍 Verifying pushed images..."

          # Extract main tag for verification
          MAIN_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Verifying primary tag: $MAIN_TAG"

          # Retry logic for image verification
          for attempt in {1..3}; do
            echo "🎯 Verification attempt $attempt..."

            if docker pull "$MAIN_TAG" && docker run --rm --timeout=30s "$MAIN_TAG" python3 --version; then
              echo "✅ Image verification successful on attempt $attempt"
              break
            else
              echo "❌ Image verification failed on attempt $attempt"
              if [ $attempt -eq 3 ]; then
                echo "❌ Image verification failed after 3 attempts"
                echo "⚠️ Images may have been pushed but are not immediately available"
                # Don't fail completely as this might be a temporary registry issue
                echo "Images pushed but verification failed - check registry manually" >> $GITHUB_STEP_SUMMARY
              else
                echo "⏳ Waiting 30 seconds before retry..."
                sleep 30
              fi
            fi
          done

  # Success summary
  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images, test-images, push-to-registry]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🐳 Docker Build & Release Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.should-build }}" == "true" ]; then
            echo "**Build Status:** ✅ Executed" >> $GITHUB_STEP_SUMMARY
            echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Build | ${{ needs.build-images.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Test | ${{ needs.test-images.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Push | ${{ needs.push-to-registry.result }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Build Status:** ⏭️ Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
            echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          fi
